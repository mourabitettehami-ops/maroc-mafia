<style>

.wrap{position:relative;z-index:1;max-width:600px;margin:auto}
body[data-ph=lobby]{--bg:linear-gradient(165deg,#0f1a3d,#0a0d17 60%,#1b0d16)}

body[data-ph=talk]{--bg:linear-gradient(180deg,#2a1a10,#6b4524 80%,#9a6a30)}
body[data-ph=vote],body[data-ph=rev]{--bg:linear-gradient(180deg,#1f0a12,#5a1424 80%,#7d1e32)}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(160deg,#8c1c2b,#2a0c14);display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold2);flex:none}
h1{margin:0;font:700 24px/1.1 "Reem Kufi",Cairo,sans-serif}
.tag{margin:0;font-size:12px;color:var(--mut)}
.lang{display:flex;gap:4px;direction:ltr}
.lang button{min-height:30px;padding:2px 10px;font:600 12px Cairo,sans-serif;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--cream);cursor:pointer}
.lang .on{background:var(--gold);color:#2a1d05;border-color:var(--gold2)}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.panel[hidden]{display:none}
#er{color:var(--gold2);font-weight:600;text-align:center;margin:4px 0;min-height:0}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--cream);font:inherit;margin:6px 0}
input::placeholder{color:rgba(244,234,210,.4)}
input[type=checkbox]{width:auto;margin:0 6px}
.btn{font:inherit;font-weight:700;min-height:46px;padding:8px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--cream);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d05;border-color:#f6e2a8;box-shadow:0 4px 18px rgba(212,175,90,.28)}
.btn.block{width:100%;margin-top:8px}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
.phase{display:flex;gap:12px;align-items:center}
.pi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(212,175,90,.25),rgba(212,175,90,.08));border:1px solid var(--line);color:var(--gold2);flex:none}
.phase h2{margin:0;font:700 22px/1.2 "Reem Kufi",Cairo,sans-serif}
.phase p{margin:2px 0 0;color:var(--mut)}
.tm{margin-inline-start:auto;font:700 24px "Reem Kufi",Cairo,sans-serif;color:var(--gold2)}
.tbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .25s linear}
.role{display:flex;gap:14px;align-items:center;border-color:var(--gold);background:linear-gradient(160deg,rgba(212,175,90,.14),rgba(255,255,255,.03));position:relative}
.role::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:13px;pointer-events:none}
.ri{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.3);border:1px solid var(--gold)}
.rm .ri{color:#ef7b88}.rd .ri{color:#5fd1ae}.rc .ri{color:#8fc7ff}.rv .ri{color:var(--cream)}
.role h3{margin:0;font:700 20px "Reem Kufi",Cairo,sans-serif}
.role p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);min-height:94px}

.tile.mine{background:rgba(212,175,90,.2)}.tile.dead{opacity:.42;filter:grayscale(.8)}.tile.spk{border-color:var(--green);box-shadow:0 0 14px rgba(63,174,140,.35)}

.tn{font-size:13px;font-weight:600;line-height:1.2;word-break:break-word;text-align:center}
.tg{font-size:11px;color:var(--mut);display:flex;gap:3px;align-items:center;min-height:14px}

.chk{display:block;margin-top:10px;color:var(--mut);font-size:13px}
.brow{margin:10px 0}.bt{display:flex;justify-content:space-between;font-weight:600}
.bb{height:8px;border-radius:6px;background:rgba(255,255,255,.1);margin:4px 0;overflow:hidden}
.bb i{display:block;height:100%;background:linear-gradient(90deg,#c23b4a,#e9876f)}
.brow small{color:var(--mut)}
h4{margin:0 0 6px;font:700 16px "Reem Kufi",Cairo,sans-serif;color:var(--gold2)}
ul.log,ul.ru{padding:0;margin:0;list-style:none}

.ru li{padding:5px 0;color:var(--mut);font-size:14px}
#clog{height:190px;overflow:auto;background:rgba(0,0,0,.3);border-radius:12px;padding:8px;margin:8px 0}
.m{margin:5px 0;padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.1);max-width:88%;font-size:14px;word-break:break-word}
.m.me{background:rgba(63,174,140,.25);margin-inline-start:auto}.m.mf{background:rgba(194,59,74,.3)}.m b{color:var(--gold2)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1;min-height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--cream);font:600 13px Cairo,sans-serif;cursor:pointer}
.tabs .on{background:var(--gold);color:#2a1d05}
summary{font-weight:700;cursor:pointer;color:var(--gold2)}
.ic{display:block}

    let tg='';
    if(!live&&rv)tg=ic(rv,12)+' '+t('r.'+rv);
    else if(ph==='end'&&rv)tg=ic(rv,12)+' '+t('r.'+rv);
    else if(p===G.acc&&(ph==='def'||ph==='rev'))tg=ic('scale',12);
    else if(p===MID)tg=t('you');
    return '<button class="'+cls+'" '+(can?'onclick="act(\''+mode+'\',\''+esc(p)+'\')"':'disabled')+'>'+av(p,G.nm[p])+'<span class="tn">'+esc(G.nm[p])+'</span><span class="tg">'+tg+'</span></button>';
  }).join('')+'</div>'+extra+'</div>';
  if(ph==='vote'||ph==='def'||ph==='rev')h+=board();
  h+='<div class="panel"><ul class="log">'+G.log.slice().reverse().map(e=>'<li>'+esc(t('l.'+e.k,{n:e.n||'',r:e.r?t('r.'+e.r):''}))+'</li>').join('')+'</ul></div>';
  if(isHost()&&timed)h+='<button class="btn block" onclick="skip()">'+t('skip')+'</button>';
  if(isHost()&&ph==='end')h+='<button class="btn gold block" onclick="again()">'+t('again')+'</button>';
  return h;
}
function render(){
  document.body.dataset.ph=base?G.ph:'lobby';
  if(!base)return;
  $('#app').innerHTML=G.ph==='lobby'?lobbyHTML():gameHTML();
  chatUI();
}
setInterval(()=>{
  const a=$('#tm'),b=$('#tb');if(!a||!G.dl)return;
  const r=Math.max(0,G.dl-Date.now());
  a.textContent=Math.ceil(r/1000)+t('secs');
  if(b)b.style.width=(G.du?Math.min(100,r/G.du*100):0)+'%';
},250);
try{const q=new URLSearchParams(location.search).get('room');if(q)$('#cd').value=q;const n=localStorage.getItem('nm');if(n)$('#nm').value=n}catch(e){}
applyLang();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
